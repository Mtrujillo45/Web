services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mompossina_pedidos
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/mompossina_pedidos
      SESSION_SECRET: ${SESSION_SECRET:-cambia-este-valor-en-produccion}
      STORAGE_DRIVER: local
      SEED_COMERCIAL_PASSWORD: ${SEED_COMERCIAL_PASSWORD:-cambiar123}
      SEED_PRODUCCION_PASSWORD: ${SEED_PRODUCCION_PASSWORD:-cambiar123}
      SEED_DEMO_CLIENT: ${SEED_DEMO_CLIENT:-false}
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/uploads

volumes:
  db_data:
  uploads_data:
